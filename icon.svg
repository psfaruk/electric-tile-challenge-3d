<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B131B"/>
      <stop offset="1" stop-color="#101B26"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <filter id="glowBolt" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <pattern id="scan" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
      <rect width="12" height="4" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- dark rounded-square backdrop, vertical gradient, scanlines, rim -->
  <rect x="0" y="0" width="192" height="192" rx="34.56" ry="34.56" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="192" height="192" rx="34.56" ry="34.56" fill="url(#scan)"/>
  <rect x="1.25" y="1.25" width="189.5" height="189.5" rx="33.31" ry="33.31"
        fill="none" stroke="#1E2A36" stroke-width="2.5" stroke-opacity="0.82"/>

  <!-- 3x3 electric floor-tile grid: fills, teal glow passes, crisp borders -->
  <g fill="#10181F">
    <rect x="26.88" y="26.88" width="38.4" height="38.4" rx="3.072"/>
    <rect x="76.8" y="26.88" width="38.4" height="38.4" rx="3.072"/>
    <rect x="126.72" y="26.88" width="38.4" height="38.4" rx="3.072"/>
    <rect x="26.88" y="76.8" width="38.4" height="38.4" rx="3.072"/>
    <rect x="126.72" y="76.8" width="38.4" height="38.4" rx="3.072"/>
    <rect x="26.88" y="126.72" width="38.4" height="38.4" rx="3.072"/>
    <rect x="76.8" y="126.72" width="38.4" height="38.4" rx="3.072"/>
    <rect x="126.72" y="126.72" width="38.4" height="38.4" rx="3.072"/>
  </g>
  <g fill="none" stroke="#2EE6C8" stroke-width="5.184" stroke-opacity="0.16" filter="url(#glow)">
    <rect x="26.88" y="26.88" width="38.4" height="38.4" rx="3.072"/>
    <rect x="76.8" y="26.88" width="38.4" height="38.4" rx="3.072"/>
    <rect x="126.72" y="26.88" width="38.4" height="38.4" rx="3.072"/>
    <rect x="26.88" y="76.8" width="38.4" height="38.4" rx="3.072"/>
    <rect x="126.72" y="76.8" width="38.4" height="38.4" rx="3.072"/>
    <rect x="26.88" y="126.72" width="38.4" height="38.4" rx="3.072"/>
    <rect x="76.8" y="126.72" width="38.4" height="38.4" rx="3.072"/>
    <rect x="126.72" y="126.72" width="38.4" height="38.4" rx="3.072"/>
  </g>
  <g fill="none" stroke="#2EE6C8" stroke-width="3.456" stroke-opacity="0.38" filter="url(#glow)">
    <rect x="26.88" y="26.88" width="38.4" height="38.4" rx="3.072"/>
    <rect x="76.8" y="26.88" width="38.4" height="38.4" rx="3.072"/>
    <rect x="126.72" y="26.88" width="38.4" height="38.4" rx="3.072"/>
    <rect x="26.88" y="76.8" width="38.4" height="38.4" rx="3.072"/>
    <rect x="126.72" y="76.8" width="38.4" height="38.4" rx="3.072"/>
    <rect x="26.88" y="126.72" width="38.4" height="38.4" rx="3.072"/>
    <rect x="76.8" y="126.72" width="38.4" height="38.4" rx="3.072"/>
    <rect x="126.72" y="126.72" width="38.4" height="38.4" rx="3.072"/>
  </g>
  <g fill="none" stroke="#2EE6C8" stroke-width="1.728">
    <rect x="26.88" y="26.88" width="38.4" height="38.4" rx="3.072"/>
    <rect x="76.8" y="26.88" width="38.4" height="38.4" rx="3.072"/>
    <rect x="126.72" y="26.88" width="38.4" height="38.4" rx="3.072"/>
    <rect x="26.88" y="76.8" width="38.4" height="38.4" rx="3.072"/>
    <rect x="126.72" y="76.8" width="38.4" height="38.4" rx="3.072"/>
    <rect x="26.88" y="126.72" width="38.4" height="38.4" rx="3.072"/>
    <rect x="76.8" y="126.72" width="38.4" height="38.4" rx="3.072"/>
    <rect x="126.72" y="126.72" width="38.4" height="38.4" rx="3.072"/>
  </g>

  <!-- charged gold center tile -->
  <rect x="76.8" y="76.8" width="38.4" height="38.4" rx="3.072" fill="#FFC53D"/>
  <g fill="none" stroke="#FFE9A8" stroke-width="5.184" stroke-opacity="0.16" filter="url(#glow)">
    <rect x="76.8" y="76.8" width="38.4" height="38.4" rx="3.072"/>
  </g>
  <g fill="none" stroke="#FFE9A8" stroke-width="3.456" stroke-opacity="0.38" filter="url(#glow)">
    <rect x="76.8" y="76.8" width="38.4" height="38.4" rx="3.072"/>
  </g>
  <rect x="76.8" y="76.8" width="38.4" height="38.4" rx="3.072"
        fill="none" stroke="#FFE9A8" stroke-width="1.728"/>

  <!-- white lightning bolt with soft glow -->
  <polygon points="98.97,82.022 89.011,98.097 94.952,98.097 93.03,109.978 103.688,93.204 97.572,93.204 100.717,82.022" fill="#FFFFFF" fill-opacity="0.39" filter="url(#glowBolt)"/>
  <polygon points="98.97,82.022 89.011,98.097 94.952,98.097 93.03,109.978 103.688,93.204 97.572,93.204 100.717,82.022" fill="#FFFFFF"/>
</svg>
